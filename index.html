<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src 'self' file: data: blob:; style-src 'self' file: 'unsafe-inline'; font-src 'self' file: data:; script-src 'self' file:; connect-src 'self' https://raw.githubusercontent.com; frame-src 'self' blob: about:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.png">
<title>Examinator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <span class="brand">Examinator</span>
  <button class="hbtn" id="btnNew" title="Empezar un examen nuevo">Nuevo</button>
  <button class="hbtn" id="btnOpen" title="Abrir un examen guardado">Abrir…</button>
  <button class="hbtn" id="btnSave" title="Guardar este examen para seguir editándolo otro día">Guardar…</button>
  <span class="sep"></span>
  <button class="hbtn" id="btnLib" title="Textos de Perseus: descargar y elegir un fragmento">Biblioteca</button>
  <button class="hbtn" id="btnLists" title="Listas de modificación preverbial, evolución fonética, prefijos y latinismos">Listas</button>
  <button class="hbtn" id="btnSettings" title="Tipo de letra, interlineado y espacios">Ajustes</button>
  <span class="spacer"></span>
  <span class="busy hidden" id="busy">Analizando…</span>
  <button class="hbtn" id="btnDocx">Exportar Word</button>
  <button class="hbtn primary" id="btnPdf">Exportar PDF</button>
</header>
<main id="main">
  <section id="editor"></section>
  <section id="preview"><div class="sheet" id="sheet"></div></section>
</main>
<div id="lib" class="hidden"></div>
<script src="js/datos.js"></script>
<script src="js/incluidos.js"></script>
<script src="js/shim.js"></script>
<script src="js/motor.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="js/util.js"></script>
<script src="js/vocabulario.js"></script>
<script src="js/render.js"></script>
<script src="js/propose.js"></script>
<script src="js/exam.js"></script>
<script src="js/library.js"></script>
<script src="js/lists.js"></script>
<script src="js/start.js"></script>
</body>
</html>
