name: Examinator2 — PWA y regresión
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis
        run: |
          for file in js/*.js; do node --check "$file"; done
          node --check sw.js
          node --check scripts/sync-bancos.mjs
          node --check scripts/check-deployed-assets.cjs
      - name: Regresión del motor, documentos y biblioteca
        run: node tests/regression.cjs
      - name: "Estabilidad 1.0: análisis concurrente, archivos y configuración"
        run: node tests/stability-1.0.cjs
      - name: "Temas claro, oscuro y OLED: preferencias y documento intacto"
        run: node tests/theme-modes.cjs
      - name: Diptongos æ/œ y excepciones filológicas
        run: node tests/vocab-ligatures.cjs
      - name: Glosas de sintagmas y diptongos de pregunta 4
        run: node tests/vocab-gloss-ligatures.cjs
      - name: Ligaduras de texto, literatura y cabeceras de examen
        run: node tests/latin-text-header.cjs
      - name: Correcciones docentes persistentes del vocabulario
        run: node tests/vocab-save.cjs
      - name: PDF directo en iPad y botones de vocabulario
        run: node tests/pdf-ios.cjs
      - name: PWA y bancos académicos sin conexión
        run: node tests/pwa-banks.cjs
      - name: Filtros docentes y listas históricas
        run: node tests/lexico-filtros.cjs
      - name: Selección táctil de textos en iPad
        run: node tests/library-selection.cjs
      - name: Adaptación de iPhone y navegación de lector
        run: node tests/iphone-responsive.cjs
      - name: Franja superior segura en iPad
        run: node tests/top-band.cjs
      - name: Actualización segura de la PWA
        run: node tests/pwa-refresh.cjs
      - name: Diagnóstico HTTP del paquete publicado
        if: github.event_name == 'pull_request'
        run: node scripts/check-deployed-assets.cjs
