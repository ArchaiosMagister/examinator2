name: Examinator2 — regresión visual

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador real Chromium y WebKit
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Verificar maquetación iPhone, iPad, escritorio y biblioteca
        run: node tests/visual/browser.cjs
      - name: Instalar renderizadores de documentos
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils python3-pil
      - name: Comparar visualmente PDF y Word
        run: python3 tests/visual/documents.py
      - name: Conservar capturas y documentos para diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-visual
          path: artifacts/visual/
          if-no-files-found: warn
          retention-days: 14
