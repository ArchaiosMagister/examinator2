name: Examinator2 — PDF iPad y maquetación de vocabulario
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  pdf-ipad:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Usar Playwright con motores Chromium y WebKit
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Generar PDF real en iPad y verificar filas Guardar/Guardada
        run: node tests/ios-pdf-browser.cjs
